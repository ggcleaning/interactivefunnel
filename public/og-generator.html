<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630, initial-scale=1.0">
  <title>OG Image Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 1200px;
      height: 630px;
      background-color: #5B2D8E;
      background-image: radial-gradient(circle at top right, rgba(201, 168, 76, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }
    
    .pattern-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 80px;
    }

    .logo-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      margin-bottom: 50px;
    }

    .logo {
      width: 380px;
      height: auto;
    }

    .headline {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .subheadline {
      font-size: 32px;
      font-weight: 400;
      color: #F3F4F6;
      letter-spacing: 0.02em;
      opacity: 0.9;
    }

    .accent-bar {
      width: 120px;
      height: 8px;
      background-color: #C9A84C;
      border-radius: 4px;
      margin: 40px auto 0;
    }
  </style>
</head>
<body>
  <div class="pattern-overlay"></div>
  <div class="container">
    <div class="logo-container">
      <img src="./premium-logo-stacked.svg" alt="G&G Cleaning Services" class="logo" />
    </div>
    <h1 class="headline">Professional House Cleaning<br/>in Long Island</h1>
    <h2 class="subheadline">Serving Nassau & Suffolk County Since 2008</h2>
    <div class="accent-bar"></div>
  </div>
</body>
</html>
