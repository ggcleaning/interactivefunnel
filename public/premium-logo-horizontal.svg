<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B3B9C; stop-opacity:1" />
      <stop offset="40%" style="stop-color:#4B2372; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D114A; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8941E; stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941E; stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4FF; stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#FFFFFF; stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#D4E9FF; stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="windowShine">
      <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFFFFF; stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glossGradient">
      <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#FFFFFF; stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0" />
    </radialGradient>
    <filter id="sparkleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Icon Section -->
    <g transform="scale(0.8) translate(0, 20)">
      <g>
        <path d="M 60 25 C 35 25, 15 45, 15 70 C 15 95, 35 115, 60 115 C 70 115, 79 112, 86 107 L 86 85 C 81 88, 73 90, 65 90 C 48 90, 35 77, 35 70 C 35 58, 45 45, 60 45 C 72 45, 82 53, 85 63 L 85 80 L 65 80 L 65 95 L 100 95 L 100 65 C 98 42, 81 25, 60 25 Z" fill="url(#gGradient)" />
        <circle cx="50" cy="55" r="15" fill="url(#glossGradient)" />
      </g>
      <g>
        <path d="M 140 25 C 165 25, 185 45, 185 70 C 185 95, 165 115, 140 115 C 130 115, 121 112, 114 107 L 114 85 C 119 88, 127 90, 135 90 C 152 90, 165 77, 165 70 C 165 58, 155 45, 140 45 C 128 45, 118 53, 115 63 L 115 80 L 135 80 L 135 95 L 100 95 L 100 65 C 102 42, 119 25, 140 25 Z" fill="url(#gGradient)" />
        <circle cx="150" cy="55" r="15" fill="url(#glossGradient)" />
      </g>
      <g>
        <rect x="78" y="35" width="44" height="70" rx="3" fill="url(#goldGradient)" />
        <rect x="82" y="39" width="36" height="62" rx="2" fill="url(#windowGlass)" />
        <rect x="99" y="39" width="2" height="62" fill="url(#goldGradient)" opacity="0.7" />
        <rect x="82" y="69" width="36" height="2" fill="url(#goldGradient)" opacity="0.7" />
        <ellipse cx="92" cy="55" rx="12" ry="18" fill="url(#windowShine)" />
        <ellipse cx="108" cy="85" rx="8" ry="12" fill="url(#windowShine)" />
      </g>
      <g fill="url(#goldGradient)" filter="url(#sparkleGlow)">
        <path d="M 70,30 L 72,34 L 76,36 L 72,38 L 70,42 L 68,38 L 64,36 L 68,34 Z" />
        <path d="M 130,30 L 132,34 L 136,36 L 132,38 L 130,42 L 128,38 L 124,36 L 128,34 Z" />
        <path d="M 100,22 L 102.5,27 L 107.5,29.5 L 102.5,32 L 100,37 L 97.5,32 L 92.5,29.5 L 97.5,27 Z" />
      </g>
      <g>
        <rect x="98" y="125" width="4" height="25" rx="2" fill="url(#goldGradient)" />
        <ellipse cx="100" cy="149" rx="14" ry="4.5" fill="url(#goldGradient)" opacity="0.9" />
      </g>
    </g>

    <!-- Text Section -->
    <g transform="translate(180, 45)">
      <text x="0" y="30" font-family="'Montserrat', sans-serif" font-weight="700" font-size="64" fill="#4B2372" stroke="#D4AF37" stroke-width="1.5" letter-spacing="0.08em">G&amp;G</text>
      <text x="0" y="65" font-family="'Montserrat', sans-serif" font-weight="700" font-size="18" fill="#4B2372" letter-spacing="0.4em">CLEANING</text>
      <line x1="0" y1="80" x2="40" y2="80" stroke="#D4AF37" stroke-width="1.5" />
      <text x="48" y="85" font-family="'Montserrat', sans-serif" font-weight="500" font-size="12" fill="#4B2372" letter-spacing="0.3em">SERVICES</text>
      <line x1="125" y1="80" x2="165" y2="80" stroke="#D4AF37" stroke-width="1.5" />
      <text x="0" y="110" font-family="'Great Vibes', cursive" font-size="24" fill="#6B6B6B">Family Owned &amp; Operated</text>
    </g>
  </g>
</svg>
